<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Ahmad Shafique — 3D Portfolio Experience</title>
    <meta name="description" content="Interactive 3D driving portfolio built with Three.js & WebGL by Ahmad Shafique." />

    <!-- Open Graph / Meta Branding -->
    <meta property="og:site_name" content="Ahmad Shafique - 3D Portfolio">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ahmad Shafique - 3D Web Portfolio">
    <meta property="og:description" content="Explore my creative work, CS experience, and interactive 3D map.">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#00f3ff">
    <meta name="theme-color" content="#08090c">
    
    <!-- Modern Tech & Display Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style/main.css">
</head>
<body>

    <!-- 3D Canvas -->
    <canvas class="canvas js-canvas"></canvas>

    <!-- Sleek Floating HUD Loading Overlay -->
    <div class="hud-overlay js-hud-overlay">
        
        <!-- Corner Tech Brackets -->
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div>
        <div class="hud-corner bottom-right"></div>

        <!-- Top Header HUD Tag with Circular Driver Avatar -->
        <div class="hud-header">
            <!-- <div class="hud-avatar-wrapper">
                <img src="/assets/profile.jpg" alt="Ahmad Shafique" class="hud-avatar-img">
                <div class="hud-avatar-ring"></div>
            </div> -->
            
            <div class="hud-driver-details">
                <div class="hud-badge">
                    <span class="hud-status-dot"></span>
                    <span class="hud-driver">DRIVER // AHMAD SHAFIQUE</span>
                </div>
                <div class="hud-subline">CREATIVE WEB DEVELOPER • CS STUDENT • AI ENGINEER</div>
            </div>
        </div>

        <!-- Center Hero Section -->
        <div class="hud-center">
            <h1 class="hud-title">3D PORTFOLIO EXPERIENCE</h1>
            <p class="hud-subtitle">DRIVE THROUGH THE GRID TO EXPLORE PROJECTS & SKILLS</p>

            <!-- Loading Indicator -->
            <div class="hud-loader js-hud-loader">
                <div class="hud-progress-track">
                    <div class="hud-progress-bar js-hud-progress-bar"></div>
                </div>
                <span class="hud-progress-text js-hud-progress-text">INITIALIZING WORLD SYSTEM 0%</span>
            </div>

            <!-- Start Button (Revealed when loading completes) -->
            <button class="hud-start-btn js-hud-start-btn is-hidden">
                <span class="hud-btn-glow"></span>
                <span class="hud-btn-text">START ENGINE</span>
            </button>
        </div>

        <!-- Bottom Telemetry & Controls HUD -->
        <div class="hud-footer">
            <div class="hud-controls">
                <div class="hud-key-group">
                    <div class="key-cluster">
                        <span class="hud-key">W</span>
                        <div class="key-row">
                            <span class="hud-key">A</span>
                            <span class="hud-key">S</span>
                            <span class="hud-key">D</span>
                        </div>
                    </div>
                    <span class="hud-key-label">DRIVE</span>
                </div>

                <div class="hud-key-group">
                    <span class="hud-key wide">ENTER</span>
                    <span class="hud-key-label">INTERACT</span>
                </div>
            </div>

            <div class="hud-telemetry">
                <span>LOCATION: PAKISTAN [PK]</span>
                <span>ENGINE: THREE.JS / WEBGL</span>
            </div>
        </div>

    </div>

    <script type="module" src="./index.js"></script>

</body>
</html>
